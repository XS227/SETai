<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SETAEI — Sendte tilbud</title>
  <link rel="stylesheet" href="assets/css/lead-agent.css" />
  <script src="assets/js/access.js"></script>
</head>
<body>
<nav class="topnav">
  <span class="brand">SETAEI</span>
  <a href="admin.html">Leads</a>
  <a href="drafts.html">Drafts</a>
  <a class="active" href="sent.html">Sendte tilbud</a>
  <a href="settings.html">Settings</a>
  <a href="logs.html">Logs</a>
</nav>

<!-- Detail panel -->
<div class="preview-overlay" id="sentOverlay"></div>
<aside class="preview-panel" id="sentPanel">
  <div class="preview-header">
    <span class="preview-title" id="sentPanelTitle">Sendt tilbud</span>
    <button class="preview-close" id="sentPanelClose">&times;</button>
  </div>
  <div class="preview-body" id="sentPanelBody">
    <p style="color:var(--muted)">Klikk på en rad for å se detaljer.</p>
  </div>
</aside>

<main class="main">
  <section class="card">
    <div class="section-header">
      <h3>Sendte tilbud</h3>
      <button class="secondary btn-sm" onclick="loadSent()">Oppdater</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Selskap</th><th>E-post</th><th>Emne</th><th>Sendt</th><th>Åpnet</th><th>Klikket</th><th>Levering</th><th>Salgsstatus</th>
        </tr></thead>
        <tbody id="sentRows"><tr><td colspan="8" style="color:var(--muted)">Laster…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const TOKEN = window.LA_TOKEN;
const post  = (path, body) => fetch('api/' + path, {
  method: 'POST',
  headers: {'Content-Type':'application/json','X-Lead-Agent-Token':TOKEN},
  body: JSON.stringify(body)
}).then(r => r.json());

let allSent = [];

const DEL_CLASS  = {sent:'del-sent', opened:'del-opened', clicked:'del-clicked', failed:'del-failed', skipped:'del-skipped'};
const MAN_LABELS = {'':'—', replied:'Svarte', interested:'Interessert', not_relevant:'Ikke relevant', customer:'Kunde ✓'};
const MAN_STYLE  = {
  '':           'color:var(--muted)',
  replied:      'color:var(--primary)',
  interested:   'color:var(--success)',
  not_relevant: 'color:var(--muted)',
  customer:     'color:var(--success);font-weight:700'
};

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function deliveryStatus(r) {
  if (r.clicked_at)     return 'clicked';
  if (r.opened_at)      return 'opened';
  return r.send_status || 'sent';
}

function closeSentPanel() {
  document.getElementById('sentPanel').classList.remove('open');
  document.getElementById('sentOverlay').classList.remove('open');
}

function openSentPanel(r) {
  document.getElementById('sentPanelTitle').textContent = r.company_name || 'Tilbud';
  const ds  = deliveryStatus(r);
  const cls = DEL_CLASS[ds] || 'del-sent';

  document.getElementById('sentPanelBody').innerHTML = `
    <div class="preview-section">
      <h4>Mottaker</h4>
      <div class="preview-field" style="font-weight:700">${escHtml(r.company_name || '—')}</div>
      <div class="preview-field"><a href="mailto:${escHtml(r.email || '')}">${escHtml(r.email || '—')}</a></div>
    </div>

    <div class="preview-section">
      <h4>Leveringsstatus</h4>
      <div class="preview-field"><span class="badge ${cls}">${ds}</span></div>
      <div class="preview-field" style="font-size:12px;color:var(--muted)">
        Sendt: ${(r.sent_at || '—').slice(0,16)}<br>
        ${r.opened_at  ? `Åpnet: ${r.opened_at.slice(0,16)}<br>` : ''}
        ${r.clicked_at ? `Klikket: ${r.clicked_at.slice(0,16)}<br>` : ''}
        ${r.last_error ? `<span style="color:var(--danger)">Feil: ${escHtml(r.last_error)}</span>` : ''}
      </div>
    </div>

    <div class="preview-section">
      <h4>Salgsstatus</h4>
      <select id="manualStatusSel" onchange="updateManualStatus(${r.id}, this.value)" style="width:auto;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px">
        <option value="" ${!r.manual_status ? 'selected' : ''}>— Ikke satt —</option>
        <option value="replied"      ${r.manual_status==='replied'      ? 'selected' : ''}>Svarte</option>
        <option value="interested"   ${r.manual_status==='interested'   ? 'selected' : ''}>Interessert</option>
        <option value="not_relevant" ${r.manual_status==='not_relevant' ? 'selected' : ''}>Ikke relevant</option>
        <option value="customer"     ${r.manual_status==='customer'     ? 'selected' : ''}>Kunde ✓</option>
      </select>
      <div id="manStatusMsg" style="margin-top:6px;font-size:12px"></div>
    </div>

    <div class="preview-section">
      <h4>Emne</h4>
      <div class="preview-field" style="font-weight:600">${escHtml(r.subject || '—')}</div>
    </div>

    <div class="preview-section">
      <h4>Melding</h4>
      <div class="preview-draft" style="max-height:300px">${escHtml(r.message || '—')}</div>
    </div>

    ${r.cta_link ? `<div class="preview-section">
      <h4>CTA</h4>
      <div class="preview-field"><a href="${escHtml(r.cta_link)}" target="_blank" rel="noopener" class="btn-link">${escHtml(r.cta_link)}</a></div>
    </div>` : ''}
  `;

  document.getElementById('sentPanel').classList.add('open');
  document.getElementById('sentOverlay').classList.add('open');
}

async function updateManualStatus(recipientId, status) {
  const msg = document.getElementById('manStatusMsg');
  try {
    const res = await post('update-sent-status.php', {recipient_id: recipientId, manual_status: status});
    if (res.ok) {
      if (msg) { msg.innerHTML = '<span style="color:var(--success)">Lagret</span>'; setTimeout(() => { msg.textContent = ''; }, 2000); }
      const r = allSent.find(x => x.id === recipientId);
      if (r) { r.manual_status = status; renderSentRows(); }
    } else {
      if (msg) msg.innerHTML = `<span style="color:var(--danger)">Feil: ${escHtml(res.error || '')}</span>`;
    }
  } catch(e) {
    if (msg) msg.innerHTML = `<span style="color:var(--danger)">${e.message}</span>`;
  }
}

function renderSentRows() {
  const tbody = document.getElementById('sentRows');
  if (!allSent.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted)">Ingen sendte tilbud ennå.</td></tr>';
    return;
  }
  tbody.innerHTML = allSent.map(r => {
    const ds  = deliveryStatus(r);
    const cls = DEL_CLASS[ds] || 'del-sent';
    const ms  = r.manual_status || '';
    return `<tr style="cursor:pointer" onclick='openSentPanel(allSent.find(x=>x.id===${r.id}))'>
      <td style="font-weight:600">${escHtml(r.company_name || '—')}</td>
      <td>${escHtml(r.email || '—')}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(r.subject || '')}</td>
      <td style="font-size:12px;color:var(--muted)">${(r.sent_at||'').slice(0,16)}</td>
      <td style="font-size:12px">${r.opened_at  ? '✓' : '—'}</td>
      <td style="font-size:12px">${r.clicked_at ? '✓' : '—'}</td>
      <td><span class="badge ${cls}">${ds}</span></td>
      <td style="font-size:12px;${MAN_STYLE[ms]||''}">${MAN_LABELS[ms]||'—'}</td>
    </tr>`;
  }).join('');
}

async function loadSent() {
  try {
    const res = await fetch('api/list-sent-offers.php', {headers:{'X-Lead-Agent-Token':TOKEN}}).then(r=>r.json());
    allSent = res.rows || [];
    renderSentRows();
  } catch(e) {
    document.getElementById('sentRows').innerHTML = `<tr><td colspan="8" style="color:var(--danger)">Feil: ${e.message}</td></tr>`;
  }
}

window.LA_READY.then(function() {
  document.getElementById('sentPanelClose').addEventListener('click', closeSentPanel);
  document.getElementById('sentOverlay').addEventListener('click', closeSentPanel);
  loadSent();
});

window.openSentPanel = openSentPanel;
window.allSent = allSent;
window.updateManualStatus = updateManualStatus;
</script>
</body>
</html>
