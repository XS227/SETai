# Include inside the existing setai.no HTTPS server block.
location ^~ /server/remote/ {
    proxy_pass http://127.0.0.1:9159/;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /server/live.json {
    alias /run/setai-server-status/live.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    etag off;
}
location = /server/history.json {
    alias /run/setai-server-status/history.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    etag off;
}
location = /server/speed.bin {
    alias /run/setai-server-status/speed.bin;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip off;
    etag off;
}
