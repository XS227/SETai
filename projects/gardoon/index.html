<!DOCTYPE html>
<html lang="no" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gardoon — interaktiv produktvisualisering | SETAEI</title>
<meta name="description" content="To messingplater på 76 cm, én stående aksel, 37 lommer oppe og 24 nede. Teknisk visualisering, analyse og veikart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a08; --brass-hi:#f6e3ab; --brass-light:#e7c877; --brass:#c9a35a;
    --red:#a51c26; --green:#0f6a34; --ink:#f4ecd8; --muted:#a2926c;
    --dim:#6b5f42; --panel:#080706; --ok:#2f8f57; --now:#c9a35a; --next:#5a7fa3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-snap-type:y mandatory; background:var(--bg);}
  html.nosnap{scroll-snap-type:none;}
  body{
    background:radial-gradient(120% 80% at 50% 8%, rgba(30,24,17,.92) 0%, rgba(11,10,8,.98) 55%, rgba(4,4,3,1) 100%);
    color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body.fa{font-family:'Vazirmatn',sans-serif;}
  body.fa .copy h2, body.fa .hero h1, body.fa .sec-head h3, body.fa .specs dd, body.fa .plaque{
    font-family:'Vazirmatn',sans-serif; font-weight:700; letter-spacing:0; line-height:1.35;}
  body.fa .step, body.fa .spec, body.fa dt, body.fa .tag, body.fa footer, body.fa .menu a,
  body.fa .status, body.fa .k, body.fa .kk, body.fa .key, body.fa table.tbl th,
  body.fa table.tbl td:first-child, body.fa .road .n, body.fa .swatch b{
    font-family:'Vazirmatn',sans-serif; letter-spacing:0;}

  /* ---------------- scene ---------------- */
  .stage{position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events:none;}
  .stage.parked{visibility:hidden;}
  body.view-logo .stage,body.view-logo .rail,body.view-logo .hint,body.view-logo .result{display:none;}
  .glow{
    position:absolute; left:50%; top:50%; width:130vmax; height:130vmax; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 45%, rgba(201,163,90,.12) 0%, rgba(201,163,90,.035) 32%, transparent 62%);
    opacity:0; transition:opacity 1.2s ease;
  }
  .glow.on{opacity:1;}
  .starfield{
    position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,.75), transparent),
      radial-gradient(1.2px 1.2px at 68% 14%, rgba(255,246,220,.6), transparent),
      radial-gradient(1.6px 1.6px at 82% 62%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.1px 1.1px at 26% 74%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 47% 41%, rgba(255,255,255,.42), transparent),
      radial-gradient(1.1px 1.1px at 91% 31%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 6% 55%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.2px 1.2px at 58% 86%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.1px 1.1px at 35% 8%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.3px 1.3px at 74% 92%, rgba(255,255,255,.35), transparent);
  }
  .starfield.on{opacity:1;}
  .world{
    position:absolute; left:50%; top:50%; width:800px; height:800px; margin:-400px 0 0 -400px;
    transform-origin:400px 400px; will-change:transform; backface-visibility:hidden;
  }
  .layer{position:absolute; left:0; top:0; width:800px; height:800px;}
  #solar{opacity:0; visibility:hidden; transition:opacity .9s ease, visibility 0s linear .9s;}
  #solar.on{opacity:1; visibility:visible; transition:opacity .9s ease, visibility 0s;}
  .orbit{position:absolute; left:400px; top:400px; border:1px solid rgba(201,163,90,.2); border-radius:50%;}
  .planet{position:absolute; left:400px; top:400px; border-radius:50%; box-shadow:0 0 8px rgba(0,0,0,.6);}

  .plate{position:absolute; left:0; top:0; width:800px; height:800px; opacity:0;
    will-change:transform; visibility:hidden; transition:opacity .9s ease, visibility 0s linear .9s;}
  .plate.visible{opacity:1; visibility:visible; transition:opacity .9s ease, visibility 0s;}
  .disc{position:absolute; inset:0; transition:opacity .7s ease;}
  .plate.underside .disc{opacity:0;}
  .disc canvas{
    position:absolute; inset:0; width:800px; height:800px;
    opacity:0; transition:opacity .75s ease;
  }
  .plate .edge{
    position:absolute; left:0; top:0; width:800px; height:800px; border-radius:50%;
    background:linear-gradient(180deg,#6a4f20 0%,#c9a35a 20%,#f6e3ab 38%,#a9843c 60%,#4a3714 100%);
  }
  .pole{
    position:absolute; left:400px; top:400px; width:44px; margin-left:-22px; border-radius:5px;
    background:linear-gradient(90deg,#33260d 0%,#8a6a2c 12%,#e7c877 32%,#f6e3ab 44%,#c9a35a 58%,#7d5f27 78%,#2c210b 100%);
    box-shadow:inset 0 0 18px rgba(0,0,0,.5); opacity:0; transition:opacity .8s ease;
  }
  .pole.visible{opacity:1;}
  .collar{
    position:absolute; left:400px; top:400px; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%;
    background:radial-gradient(circle at 38% 30%, #fff6dc, #e7c877 40%, #8a6a2c 78%, #3a2c10 100%);
    opacity:0; transition:opacity .8s ease;
  }
  .collar.visible{opacity:1;}
  .ball{
    position:absolute; left:400px; top:400px; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #ffffff 0%, #fffaf0 30%, #e6dcc6 62%, #a1937a 88%, #6a5f4c 100%);
    box-shadow:0 0 14px rgba(255,250,240,.4), inset -2px -3px 5px rgba(0,0,0,.28);
    will-change:transform;
  }
  .ball .corona{
    position:absolute; inset:-2px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #fffdf4 0%, #ffe9a8 22%, #ffb545 50%, #f26a1b 76%, rgba(180,60,10,.12) 100%);
    box-shadow:0 0 30px 10px rgba(255,150,40,.4);
  }
  .ball-shadow{
    position:absolute; left:400px; top:400px; width:26px; height:13px; margin:-6px 0 0 -13px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.7) 0%, rgba(0,0,0,0) 72%);
  }
  .dimline{
    position:absolute; left:400px; top:400px; margin-left:60px;
    display:flex; align-items:center; gap:14px; opacity:0; transition:opacity .6s ease;
  }
  .dimline i{display:block; width:2px; height:100%; background:var(--brass); position:relative;}
  .dimline i::before,.dimline i::after{content:""; position:absolute; left:-12px; width:26px; height:2px; background:var(--brass);}
  .dimline i::before{top:0;} .dimline i::after{bottom:0;}
  .dimline span{font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--brass-hi); white-space:nowrap;}
  .dimline.visible{opacity:1;}

  /* ---------------- scroll ---------------- */
  .track{position:relative; z-index:5;}
  body.view-logo .track,body.view-logo .doc{display:none;}
  .beat{
    height:100svh; min-height:540px; scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; align-items:center; padding:0 clamp(18px,5vw,80px);
  }
  .copy{
    max-width:400px; width:100%; padding:26px 28px;
    border-inline-start:1px solid rgba(201,163,90,.28);
    background:linear-gradient(90deg, rgba(6,5,4,.94) 0%, rgba(6,5,4,.84) 58%, rgba(6,5,4,0) 100%);
    opacity:0; transform:translateY(20px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.3,1);
  }
  .beat[data-side="r"] .copy{
    margin-inline-start:auto;
    background:linear-gradient(270deg, rgba(6,5,4,.94) 0%, rgba(6,5,4,.84) 58%, rgba(6,5,4,0) 100%);
  }
  body.fa .copy{background:linear-gradient(270deg, rgba(6,5,4,.94) 0%, rgba(6,5,4,.84) 58%, rgba(6,5,4,0) 100%);}
  body.fa .beat[data-side="r"] .copy{background:linear-gradient(90deg, rgba(6,5,4,.94) 0%, rgba(6,5,4,.84) 58%, rgba(6,5,4,0) 100%);}
  .beat.active .copy{opacity:1; transform:none;}
  .step{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.26em; text-transform:uppercase;
    color:var(--brass); margin:0 0 14px; display:flex; gap:11px; align-items:center;
  }
  .step em{font-style:normal; color:var(--brass-hi); border:1px solid rgba(201,163,90,.35); border-radius:999px; padding:3px 8px; letter-spacing:.12em;}
  .copy h2{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(28px,4.2vw,46px); line-height:1.05; margin:0 0 15px; color:var(--brass-hi);}
  .copy h2 i{font-style:italic; color:var(--ink);}
  .copy p{margin:0; font-size:15px; line-height:1.7; color:#cdbf9e;}
  .copy .spec{margin-top:18px; padding-top:14px; border-top:1px solid rgba(201,163,90,.16); font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); letter-spacing:.04em;}
  .copy .spec b{color:var(--brass-light); font-weight:500;}
  .hero h1{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:clamp(34px,5.6vw,64px); line-height:1.02; margin:0 0 18px; color:var(--brass-hi);}
  .hero h1 i{font-style:italic; color:var(--ink);}

  /* ---------------- topp + meny ---------------- */
  .topnav{
    position:fixed; top:0; left:0; right:0; z-index:32; display:flex; align-items:center; gap:14px;
    padding:14px clamp(14px,4vw,34px);
    background:linear-gradient(180deg, rgba(4,4,3,.92), rgba(4,4,3,0));
  }
  .brand{color:var(--brass-hi); font-family:'Vazirmatn',sans-serif; font-size:16px; margin-inline-end:auto; text-decoration:none;}
  .langbtn,.burger{
    background:none; border:1px solid rgba(201,163,90,.4); color:var(--brass-hi); border-radius:999px;
    padding:7px 14px; cursor:pointer; font-family:'Vazirmatn',sans-serif; font-size:11px; line-height:1;
  }
  .burger{display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; letter-spacing:.18em; text-transform:uppercase;}
  .burger i{display:block; width:15px; height:9px; border-top:1.5px solid currentColor; border-bottom:1.5px solid currentColor; position:relative;}
  .burger i::after{content:""; position:absolute; top:3px; left:0; right:0; border-top:1.5px solid currentColor;}
  .langbtn:hover,.burger:hover{background:rgba(201,163,90,.12);}

  .menu{
    position:fixed; inset:0; z-index:34; background:rgba(4,4,3,.97);
    display:flex; flex-direction:column; justify-content:center; padding:0 clamp(24px,8vw,110px);
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .menu.open{opacity:1; pointer-events:auto;}
  .menu-close{position:absolute; top:16px; inset-inline-end:clamp(14px,4vw,34px);}
  .menu h5{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--brass); margin:0 0 16px;
  }
  .menu nav{display:flex; flex-direction:column; gap:4px; margin-bottom:38px;}
  .menu a{
    font-family:'Cormorant Garamond',serif; font-size:clamp(26px,4.6vw,42px); color:var(--ink);
    text-decoration:none; line-height:1.25; transition:color .2s ease;
  }
  .menu a:hover,.menu a.current{color:var(--brass-hi);}
  .menu .sub a{font-family:'Inter',sans-serif; font-size:15px; color:var(--muted); line-height:1.9;}
  body.fa .menu a{font-family:'Vazirmatn',sans-serif;}

  .rail{
    position:fixed; inset-inline-end:clamp(10px,2vw,24px); top:50%; transform:translateY(-50%); z-index:20;
    display:flex; flex-direction:column; gap:6px; align-items:center; transition:opacity .5s ease;
  }
  .rail b{display:block; width:2px; height:12px; border-radius:2px; background:rgba(201,163,90,.22); transition:all .35s ease;}
  .rail b.on{background:var(--brass-hi); height:22px;}
  .rail b.past{background:rgba(201,163,90,.5);}
  .hint{
    position:fixed; left:50%; bottom:20px; z-index:20; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--brass); display:flex; flex-direction:column; align-items:center; gap:8px; transition:opacity .5s ease;
  }
  .hint b{display:block; width:1px; height:28px; background:linear-gradient(180deg,var(--brass),transparent);}
  .result{
    position:fixed; inset-inline-start:clamp(18px,6vw,90px); top:50%; z-index:15;
    transform:translateY(-50%) scale(.92); opacity:0; pointer-events:none;
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.3,1);
  }
  .result.on{opacity:1; transform:translateY(-50%) scale(1);}
  .result .plaque{font-family:'Cormorant Garamond',serif; font-size:clamp(66px,12vw,140px); line-height:1; color:var(--brass-hi); text-shadow:0 0 60px rgba(246,227,171,.3), 0 8px 30px rgba(0,0,0,.9);}
  .result .tag{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.32em; text-transform:uppercase; color:var(--red); margin-top:4px;}

  /* ---------------- dokument ---------------- */
  .doc{position:relative; z-index:5; background:linear-gradient(180deg, rgba(4,4,3,0) 0%, #050403 10%, #070605 100%); padding:clamp(70px,12vh,140px) clamp(18px,5vw,80px) 0;}
  .doc-in{max-width:1060px; margin:0 auto;}
  .sec{padding-bottom:clamp(60px,10vh,116px); scroll-margin-top:70px; scroll-snap-align:start; scroll-snap-stop:normal;}
  .sec-head{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; border-bottom:1px solid rgba(201,163,90,.18); padding-bottom:16px; margin-bottom:32px;}
  .sec-head h3{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:clamp(26px,4.2vw,44px); margin:0; color:var(--brass-hi);}
  .k{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--brass);}
  .lead{max-width:660px; font-size:15px; line-height:1.75; color:#bdb094; margin:0 0 32px;}

  .specs{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1px; background:rgba(201,163,90,.16); border:1px solid rgba(201,163,90,.16);}
  .specs div{background:var(--panel); padding:22px 20px;}
  .specs dt{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); margin:0 0 10px;}
  .specs dd{margin:0; font-family:'Cormorant Garamond',serif; font-size:32px; color:var(--ink); line-height:1.1;}
  .specs dd small{font-size:13px; color:var(--muted); font-family:'Inter',sans-serif; margin-inline-start:5px;}
  .specs .note{display:block; margin-top:9px; font-size:12px; line-height:1.55; color:var(--dim); font-family:'Inter',sans-serif;}
  body.fa .specs .note{font-family:'Vazirmatn',sans-serif;}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:14px;}
  .card{border:1px solid rgba(201,163,90,.16); background:var(--panel); padding:22px 20px;}
  .card h4{margin:0 0 10px; font-size:15px; color:var(--brass-hi); font-weight:600;}
  .card p{margin:0; font-size:13.5px; line-height:1.68; color:#b3a78d;}
  .kk{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); display:block; margin-bottom:12px;}

  .tbl-wrap{overflow-x:auto;}
  table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px;}
  table.tbl th,table.tbl td{text-align:start; padding:14px; border-bottom:1px solid rgba(201,163,90,.13); vertical-align:top;}
  table.tbl th{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); font-weight:400;}
  table.tbl td{color:#b3a78d; line-height:1.6;}
  table.tbl td:first-child{color:var(--brass-light); font-family:'JetBrains Mono',monospace; font-size:12px;}

  .road{list-style:none; margin:0; padding:0;}
  .road li{display:grid; grid-template-columns:52px 1fr auto; gap:20px; align-items:start; padding:22px 0; border-bottom:1px solid rgba(201,163,90,.13);}
  .road .n{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--brass); padding-top:3px;}
  .road h4{margin:0 0 7px; font-size:16px; color:var(--ink); font-weight:600;}
  .road p{margin:0; font-size:13.5px; line-height:1.62; color:#a2977e;}
  .status{font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; padding:5px 10px; border-radius:999px; white-space:nowrap; border:1px solid currentColor;}
  .status.done{color:var(--ok);} .status.now{color:var(--now);} .status.next{color:var(--next);}

  .seqblock{margin-bottom:30px;}
  .seqblock h6{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); margin:0 0 12px; font-weight:400;}
  .seq{display:flex; flex-wrap:wrap; gap:4px; direction:ltr;}
  .seq span{width:33px; height:33px; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:#f0e6cf; border-radius:3px; background:#161616;}
  .seq span.r{background:linear-gradient(180deg,#a51c26,#6c1219);}
  .seq span.g{background:linear-gradient(180deg,#0f6a34,#073d1e);}
  .seq span.h{box-shadow:inset 0 0 0 1.5px var(--brass-hi);}
  .key{margin:14px 0 0; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--dim);}

  .legal{border:1px solid rgba(201,163,90,.2); background:var(--panel); padding:26px 24px;}
  .legal p{margin:0 0 12px; font-size:13.5px; line-height:1.72; color:#b3a78d;}
  .legal p:last-child{margin-bottom:0;}
  .legal b{color:var(--brass-hi); font-weight:600;}

  footer{
    scroll-snap-align:end; border-top:1px solid rgba(201,163,90,.16); padding:30px 0 44px; margin-top:16px;
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  }
  footer a{color:var(--brass); text-decoration:none;}
  footer a:hover{color:var(--brass-hi);}

  /* ---------------- logoside ---------------- */
  .logopage{display:none; position:relative; z-index:5; padding:clamp(96px,14vh,150px) clamp(18px,5vw,80px) 0;}
  body.view-logo .logopage{display:block;}
  .logo-hero{max-width:720px; margin:0 auto clamp(50px,8vh,90px);}
  .logo-hero h1{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:clamp(34px,6vw,62px); margin:0 0 18px; color:var(--brass-hi);}
  body.fa .logo-hero h1{font-family:'Vazirmatn',sans-serif; font-weight:700;}
  .logo-hero p{font-size:15px; line-height:1.75; color:#bdb094; margin:0;}
  .logogrid{max-width:1060px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px;}
  .logocard{border:1px solid rgba(201,163,90,.18); background:var(--panel); overflow:hidden;}
  .logostage{
    aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #171310 0%, #0a0908 70%);
    border-bottom:1px solid rgba(201,163,90,.14);
  }
  .logostage svg{width:62%; height:auto;}
  .logovariants{display:flex; border-bottom:1px solid rgba(201,163,90,.14);}
  .logovariants div{flex:1; aspect-ratio:2/1; display:flex; align-items:center; justify-content:center;}
  .logovariants div+div{border-inline-start:1px solid rgba(201,163,90,.14);}
  .logovariants svg{width:52%; height:auto;}
  .v-brass{background:#100e0b;} .v-light{background:#efe7d6;} .v-mono{background:#0f0f0f;}
  .logometa{padding:22px 20px;}
  .logometa h4{margin:0 0 4px; font-size:17px; color:var(--brass-hi);}
  .logometa .lat{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); display:block; margin-bottom:12px;}
  .logometa p{margin:0 0 12px; font-size:13.5px; line-height:1.68; color:#b3a78d;}
  .logometa .use{margin:0; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--dim); line-height:1.7;}
  body.fa .logometa .use{font-family:'Vazirmatn',sans-serif;}
  .palette{max-width:1060px; margin:clamp(56px,9vh,100px) auto 0; }
  .swatches{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:rgba(201,163,90,.16); border:1px solid rgba(201,163,90,.16);}
  .swatch{background:var(--panel); padding:0;}
  .swatch .chip{height:86px;}
  .swatch .txt{padding:14px 16px;}
  .swatch b{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink); font-weight:400; margin-bottom:5px;}

<script>
/* =====================================================
   1. HJULENE
===================================================== */
const TOP_POCKETS = [
  [0,'g',true],[32,'r',false],[15,'b',false],[19,'r',false],[4,'b',true],
  [21,'r',false],[2,'b',false],[25,'r',false],[17,'b',false],[34,'r',true],
  [6,'b',false],[27,'r',false],[13,'b',false],[36,'r',true],[11,'b',false],
  [30,'r',false],[8,'b',false],[23,'r',false],[10,'b',true],[5,'r',false],
  [24,'b',false],[16,'r',false],[33,'b',false],[1,'r',false],[20,'b',true],
  [14,'r',false],[31,'b',false],[9,'r',false],[22,'b',true],[18,'r',false],
  [29,'b',false],[7,'r',false],[28,'b',true],[12,'r',false],[35,'b',false],
  [3,'r',false],[26,'b',false]
];
/* nedre plate: kun tallene som har hull i øvre plate, gjentatt tre runder */
const HOLE_NUMS=[0,4,10,20,22,28,34,36];
const GROUP_COLORS=['g','r','b','r','b','r','b','r'];
const BOT_POCKETS=[];
for(let round=0; round<3; round++){
  HOLE_NUMS.forEach((n,i)=>BOT_POCKETS.push([n,GROUP_COLORS[i],false]));
}
const STEP_T=360/TOP_POCKETS.length;   /* 9,73° */
const STEP_B=360/BOT_POCKETS.length;   /* 15°   */

const cx=400, cy=400;
const rEdge=396, rRimInner=350, rPocketOuter=326, rPocketInner=236, rNumber=282, rHole=190;
const rConeOuter=236, rConeMid=150, rHubTop=60, rHandleLen=88, rKnob=20;
const FILL={r:'url(#redG)',b:'url(#blackG)',g:'url(#greenG)'};

const pt=(r,deg)=>{const a=(deg-90)*Math.PI/180; return [ (cx+r*Math.cos(a)).toFixed(2), (cy+r*Math.sin(a)).toFixed(2) ];};
function arcPath(rOut,rIn,a0,a1){
  const [x0o,y0o]=pt(rOut,a0),[x1o,y1o]=pt(rOut,a1),[x1i,y1i]=pt(rIn,a1),[x0i,y0i]=pt(rIn,a0);
  return `M ${x0o} ${y0o} A ${rOut} ${rOut} 0 0 1 ${x1o} ${y1o} L ${x1i} ${y1i} A ${rIn} ${rIn} 0 0 0 ${x0i} ${y0i} Z`;
}

/* Bygger hele hjulet som én SVG-streng. Rasteriseres til canvas én gang per tilstand,
   slik at nettleseren ikke må tegne vektorene på nytt for hver eneste frame. */
function wheelSVG(pockets, step, opt){
  const P=[];
  P.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">`);
  P.push(`<defs>
   <linearGradient id="rimG" x1="15%" y1="0%" x2="85%" y2="100%">
     <stop offset="0%" stop-color="#f6e3ab"/><stop offset="30%" stop-color="#c9a35a"/>
     <stop offset="55%" stop-color="#8a6a2c"/><stop offset="78%" stop-color="#c9a35a"/>
     <stop offset="100%" stop-color="#f6e3ab"/></linearGradient>
   <radialGradient id="faceG" cx="38%" cy="34%" r="75%">
     <stop offset="0%" stop-color="#f6e3ab"/><stop offset="45%" stop-color="#d1ab63"/>
     <stop offset="78%" stop-color="#96762f"/><stop offset="100%" stop-color="#5a4318"/></radialGradient>
   <radialGradient id="coneG" cx="36%" cy="30%" r="80%">
     <stop offset="0%" stop-color="#fdf1cf"/><stop offset="35%" stop-color="#e7c877"/>
     <stop offset="65%" stop-color="#b78e46"/><stop offset="88%" stop-color="#7a5c26"/>
     <stop offset="100%" stop-color="#4a3714"/></radialGradient>
   <radialGradient id="hubG" cx="35%" cy="30%" r="80%">
     <stop offset="0%" stop-color="#fff6dc"/><stop offset="45%" stop-color="#e7c877"/>
     <stop offset="80%" stop-color="#8a6a2c"/><stop offset="100%" stop-color="#3a2c10"/></radialGradient>
   <radialGradient id="redG" cx="50%" cy="32%" r="80%">
     <stop offset="0%" stop-color="#c8323f"/><stop offset="100%" stop-color="#6c1219"/></radialGradient>
   <radialGradient id="blackG" cx="50%" cy="32%" r="80%">
     <stop offset="0%" stop-color="#2e2e2e"/><stop offset="100%" stop-color="#0a0a0a"/></radialGradient>
   <radialGradient id="greenG" cx="50%" cy="32%" r="80%">
     <stop offset="0%" stop-color="#1c8a4c"/><stop offset="100%" stop-color="#073d1e"/></radialGradient>
   <radialGradient id="holeG" cx="45%" cy="38%" r="65%">
     <stop offset="0%" stop-color="#2a2a2a"/><stop offset="55%" stop-color="#0a0a0a"/>
     <stop offset="100%" stop-color="#000"/></radialGradient>
  </defs>`);

  P.push(`<circle cx="400" cy="400" r="${rEdge}" fill="none" stroke="url(#rimG)" stroke-width="16"/>`);
  P.push(`<circle cx="400" cy="400" r="388" fill="none" stroke="#4a3714" stroke-width="1.6" opacity=".55"/>`);
  P.push(`<circle cx="400" cy="400" r="${rRimInner}" fill="none" stroke="url(#rimG)" stroke-width="30"/>`);
  P.push(`<circle cx="400" cy="400" r="336" fill="none" stroke="#4a3714" stroke-width="1.4" opacity=".5"/>`);
  P.push(`<circle cx="400" cy="400" r="${rPocketOuter}" fill="url(#faceG)"/>`);

  if(opt.colors){
    pockets.forEach((p,i)=>P.push(
      `<path d="${arcPath(rPocketOuter,rPocketInner,i*step,(i+1)*step)}" fill="${FILL[p[1]]}" stroke="#e7c877" stroke-width="1.2"/>`));
  }
  P.push(`<circle cx="400" cy="400" r="${rPocketOuter}" fill="none" stroke="#f6e3ab" stroke-width="1.3" opacity=".8"/>`);
  P.push(`<circle cx="400" cy="400" r="${rPocketInner}" fill="none" stroke="#f6e3ab" stroke-width="1.3" opacity=".8"/>`);
  pockets.forEach((p,i)=>{
    const [x1,y1]=pt(rPocketOuter+3,i*step),[x2,y2]=pt(rPocketInner-2,i*step);
    P.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8a6a2c" stroke-width="1" opacity=".6"/>`);
  });

  if(opt.numbers){
    pockets.forEach((p,i)=>{
      const mid=i*step+step/2,[x,y]=pt(rNumber,mid);
      const fs=(step>12?28:(p[0]===0?26:23));
      P.push(`<text x="${x}" y="${y}" font-size="${fs}" font-family="Georgia,'Times New Roman',serif" font-weight="700" fill="#f7efe0" stroke="rgba(0,0,0,.5)" stroke-width="1" paint-order="stroke" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid.toFixed(2)} ${x} ${y})">${p[0]}</text>`);
    });
  }

  P.push(`<circle cx="400" cy="400" r="${rConeOuter}" fill="url(#coneG)"/>`);
  P.push(`<circle cx="400" cy="400" r="${rConeOuter}" fill="none" stroke="#4a3714" stroke-width="1.4" opacity=".5"/>`);
  P.push(`<circle cx="400" cy="400" r="${rConeMid}" fill="none" stroke="#4a3714" stroke-width="1" opacity=".35"/>`);
  for(let i=0;i<pockets.length;i++){
    const [x1,y1]=pt(rConeOuter-4,i*step),[x2,y2]=pt(rHubTop+18,i*step);
    P.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#4a3714" stroke-width=".6" opacity=".22"/>`);
  }
  if(opt.holes){
    pockets.forEach((p,i)=>{
      if(!p[2]) return;
      const [x,y]=pt(rHole,i*step+step/2);
      P.push(`<circle cx="${x}" cy="${y}" r="12" fill="url(#holeG)" stroke="#f6e3ab" stroke-width="1.7"/>`);
      P.push(`<circle cx="${x}" cy="${y}" r="4" fill="#000"/>`);
    });
  }
  P.push(`<circle cx="400" cy="400" r="${rHubTop+26}" fill="url(#hubG)" stroke="#3a2c10" stroke-width="1.8"/>`);
  P.push(`<circle cx="400" cy="400" r="${rHubTop}" fill="url(#hubG)" stroke="#f6e3ab" stroke-width="1.6"/>`);
  [0,90,180,270].forEach(a=>{
    const [x1,y1]=pt(18,a),[x2,y2]=pt(rHandleLen,a);
    P.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#hubG)" stroke-width="9" stroke-linecap="round"/>`);
    P.push(`<circle cx="${x2}" cy="${y2}" r="11" fill="url(#hubG)" stroke="#3a2c10" stroke-width="1.3"/>`);
  });
  P.push(`<circle cx="400" cy="400" r="${rKnob}" fill="url(#hubG)" stroke="#f6e3ab" stroke-width="1.6"/>`);
  P.push(`<circle cx="400" cy="400" r="7" fill="#fff6dc"/>`);
  P.push(`</svg>`);
  return P.join('');
}

/* --- canvas-par per hjul, med kryssfading mellom tilstander --- */
const RASTER = Math.min(1200, Math.round(Math.min(window.innerWidth,window.innerHeight)*1.9)) || 900;
function makeWheel(host, pockets, step){
  const a=document.createElement('canvas'), b=document.createElement('canvas');
  [a,b].forEach(c=>{ c.width=c.height=RASTER; host.appendChild(c); });
  return {host, pockets, step, a, b, showing:null, key:''};
}
function setWheel(w, opt){
  const key=`${opt.colors?1:0}${opt.numbers?1:0}${opt.holes?1:0}`;
  if(w.key===key) return;
  w.key=key;
  const target = w.showing===w.a ? w.b : w.a;
  const img=new Image();
  img.onload=()=>{
    const ctx=target.getContext('2d');
    ctx.clearRect(0,0,RASTER,RASTER);
    ctx.drawImage(img,0,0,RASTER,RASTER);
    target.style.opacity=1;
    if(w.showing && w.showing!==target) w.showing.style.opacity=0;
    w.showing=target;
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(wheelSVG(w.pockets,w.step,opt));
}
const wheelTop=makeWheel(document.getElementById('discTop'),TOP_POCKETS,STEP_T);
const wheelBot=makeWheel(document.getElementById('discBottom'),BOT_POCKETS,STEP_B);

/* =====================================================
   2. GEOMETRI — 800 px = 76 cm
===================================================== */
const PXCM=800/76;
const Z_TOP=-321, Z_BOT=321;
const THICK=11*PXCM;
const R_TRACK=360, R_POCKET=281, R_HOLE=190;
const HOLE_INDEX=TOP_POCKETS.findIndex(p=>p[0]===20);   /* hullet kula faller i */
const WIN_INDEX=3;                                      /* nedre lomme: tallet 20 */
const HOLE_A=HOLE_INDEX*STEP_T+STEP_T/2;
const WIN_A=WIN_INDEX*STEP_B+STEP_B/2;

const stage=document.getElementById('stage');
const world=document.getElementById('world');
const ball=document.getElementById('ball');
const corona=document.getElementById('corona');
const shadow=document.getElementById('shadow');
const plateTop=document.getElementById('plateTop');
const plateBottom=document.getElementById('plateBottom');
const discTop=document.getElementById('discTop');
const discBottom=document.getElementById('discBottom');
const edgeTop=plateTop.querySelector('.edge');
const edgeBot=plateBottom.querySelector('.edge');
const pole=document.getElementById('pole');
const collarTop=document.getElementById('collarTop');
const collarBottom=document.getElementById('collarBottom');
const dimline=document.getElementById('dimline');
const glow=document.getElementById('glow');
const stars=document.getElementById('stars');
const solar=document.getElementById('solar');
const result=document.getElementById('result');
const hint=document.getElementById('hint');
const rail=document.getElementById('rail');

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const PLANETS=[
  {r:150,s:7, c:'#b7a893', d:1.00},{r:196,s:10,c:'#d8b784', d:0.76},
  {r:242,s:11,c:'#6fa8dc', d:0.60},{r:290,s:9, c:'#c1553b', d:0.48},
  {r:360,s:20,c:'#d9b98a', d:0.29},{r:424,s:17,c:'#e0cf9a', d:0.22},
  {r:484,s:13,c:'#93c9d6', d:0.16},{r:540,s:13,c:'#5b7fc7', d:0.12}
];
const planetEls=PLANETS.map(pl=>{
  const o=document.createElement('div');
  o.className='orbit';
  o.style.width=o.style.height=(pl.r*2)+'px';
  o.style.margin=(-pl.r)+'px 0 0 '+(-pl.r)+'px';
  solar.appendChild(o);
  const d=document.createElement('div');
  d.className='planet';
  d.style.width=d.style.height=pl.s+'px';
  d.style.margin=(-pl.s/2)+'px 0 0 '+(-pl.s/2)+'px';
  d.style.background='radial-gradient(circle at 34% 30%, rgba(255,255,255,.55), transparent 60%), '+pl.c;
  solar.appendChild(d);
  return {orbit:o, dot:d, r:pl.r, d:pl.d, phase:Math.random()*Math.PI*2};
});

const CAM=[
  {x:0,   z:0,     s:.52, phi:62},{x:0,   z:-260,  s:1.4, phi:62},
  {x:150, z:-520,  s:2.5, phi:60},{x:-165,z:Z_TOP, s:1.00,phi:58},
  {x:-165,z:Z_TOP, s:1.10,phi:42},{x:160, z:Z_TOP, s:1.14,phi:30},
  {x:160, z:Z_TOP, s:1.16,phi:20},{x:-160,z:Z_TOP, s:1.00,phi:48},
  {x:-160,z:Z_TOP, s:1.00,phi:56},{x:165, z:Z_TOP, s:1.16,phi:10},
  {x:165, z:Z_TOP, s:1.75,phi:18, follow:.8},{x:-175,z:0, s:.48, phi:60},
  {x:-175,z:0,     s:.54, phi:60},{x:170, z:Z_BOT-130, s:.92, phi:70},
  {x:170, z:Z_BOT, s:1.06,phi:76},{x:-168,z:Z_BOT, s:1.10,phi:44},
  {x:150, z:Z_BOT, s:1.16,phi:28},{x:150, z:Z_BOT, s:1.26,phi:30}
];
const BEATS=CAM.length-1;

let p=0, pTarget=0, rotTop=0, rotBot=0, dropAngle=null, last=performance.now(), solarT=0;
let beatsEls=[], railTicks=[], view='reisen';

function proj(r,angleDeg,z,cosP,sinP){
  const a=angleDeg*Math.PI/180;
  return {x:r*Math.sin(a), y:-r*Math.cos(a)*cosP + z*sinP, depth:-Math.cos(a)};
}

function onScroll(){
  if(view!=='reisen') return;
  pTarget=clamp(window.scrollY/window.innerHeight,0,BEATS-1);
  if(reduce) p=pTarget;
  const b=Math.round(pTarget);
  beatsEls.forEach((s,i)=>s.classList.toggle('active', i===b));
  railTicks.forEach((t,i)=>{t.classList.toggle('on',i===b); t.classList.toggle('past',i<b);});
  hint.style.opacity=pTarget>.15?0:1;
  rail.style.opacity=pTarget>BEATS-1.1?0:1;

  stars.classList.toggle('on', pTarget<1.4);
  solar.classList.toggle('on', pTarget<.85);
  glow.classList.toggle('on', pTarget>1.4);
  /* fra og med andre landing er det bare den nedre platen som er scenen:
     kort overgang der vi ser undersiden av den øvre, så forsvinner den helt */
  plateTop.classList.toggle('visible', pTarget>2.45 && pTarget<13.6);
  plateTop.classList.toggle('underside', pTarget>12.4);
  setWheel(wheelTop,{colors:pTarget>5.45, numbers:pTarget>4.45, holes:pTarget>3.45});
  plateBottom.classList.toggle('visible', pTarget>10.4);
  setWheel(wheelBot,{colors:true, numbers:true, holes:false});
  pole.classList.toggle('visible', pTarget>10.4);
  collarTop.classList.toggle('visible', pTarget>10.4 && pTarget<13.6);
  collarBottom.classList.toggle('visible', pTarget>10.4);
  dimline.classList.toggle('visible', pTarget>10.7 && pTarget<12.4);
  result.classList.toggle('on', false);
  /* når dokumentdelen dekker skjermen står scenen helt stille og tas ut av tegningen */
  const vh=window.innerHeight, parked=stage.classList.contains('parked');
  stage.classList.toggle('parked', window.scrollY > vh*(parked ? BEATS-0.25 : BEATS+0.35));
  if(pTarget<9.9) dropAngle=null;
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);

const _last={};
function setT(elm,key,val){ if(_last[key]!==val){ _last[key]=val; elm.style.transform=val; } }

function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(view!=='reisen'){ requestAnimationFrame(frame); return; }

  const dp=pTarget-p;
  p = Math.abs(dp)<0.0005 ? pTarget : p + dp*Math.min(1, dt*9);
  const still = Math.abs(dp)<0.0005;
  if(still && pTarget>=BEATS-1 && window.scrollY>window.innerHeight*(BEATS-0.2)){
    requestAnimationFrame(frame); return;
  }
  const i=Math.floor(p), t=p-i;

  if(!reduce){
    let sT=0,sB=0;
    if(p>=6.6&&p<8) sT=lerp(0,175,clamp((p-6.6)/1.2,0,1));
    else if(p>=8&&p<10) sT=lerp(175,30,easeOut(clamp((p-8)/2,0,1)));
    else if(p>=10) sT=24;
    if(p>=12.6&&p<15) sB=-lerp(0,145,clamp((p-12.6)/1.2,0,1));
    else if(p>=15) sB=lerp(-145,0,easeOut(clamp((p-15)/1.4,0,1)));
    rotTop+=sT*dt; rotBot+=sB*dt; solarT+=dt;
  }
  if(p>16.4){
    const cur=((rotBot%360)+360)%360, want=(((180-WIN_A)%360)+360)%360;
    let d=want-cur; if(d>180)d-=360; if(d<-180)d+=360;
    rotBot+=d*Math.min(1,dt*3);
  }
  setT(discTop,'rt',`rotate(${rotTop.toFixed(1)}deg)`);
  setT(discBottom,'rb',`rotate(${rotBot.toFixed(1)}deg)`);

  const c0=CAM[clamp(i,0,BEATS)], c1=CAM[clamp(i+1,0,BEATS)];
  const e=easeInOut(t);
  const phi=lerp(c0.phi,c1.phi,e)*Math.PI/180;
  const cosP=Math.cos(phi), sinP=Math.sin(phi);
  const camS=lerp(c0.s,c1.s,e);
  const mob=window.innerWidth<760;
  const unit=Math.min(560, window.innerWidth*(mob?1.02:.9), window.innerHeight*(mob?.60:.80))/800;
  const s=unit*camS;
  const camZ=lerp(c0.z,c1.z,e);
  const camX=mob?0:lerp(c0.x,c1.x,e);
  const camYoff=mob?-window.innerHeight*0.14:0;
  const follow=lerp(c0.follow||0,c1.follow||0,e);

  const zT=Z_TOP*sinP, zB=Z_BOT*sinP, kY=cosP.toFixed(4);
  setT(plateTop,'pt',`translateY(${zT.toFixed(1)}px) scaleY(${kY})`);
  setT(plateBottom,'pb',`translateY(${zB.toFixed(1)}px) scaleY(${kY})`);
  const eOff=(THICK*sinP).toFixed(1);
  setT(edgeTop,'et',`translateY(${eOff}px)`);
  setT(edgeBot,'eb',`translateY(${eOff}px)`);
  const poleH=Math.max(1,(Z_BOT-Z_TOP)*sinP), poleHs=poleH.toFixed(1)+'px';
  if(_last.ph!==poleHs){ _last.ph=poleHs; pole.style.height=poleHs; dimline.style.height=poleHs; }
  setT(pole,'po',`translateY(${(-poleH/2).toFixed(1)}px)`);
  setT(dimline,'dl',`translateY(${(-poleH/2).toFixed(1)}px)`);
  setT(collarTop,'ct',`translateY(${(zT+THICK*sinP*0.5).toFixed(1)}px) scaleY(${kY})`);
  setT(collarBottom,'cb',`translateY(${zB.toFixed(1)}px) scaleY(${kY})`);

  if(p<1.5){
    planetEls.forEach(pl=>{
      const a=pl.phase+solarT*pl.d*.32;
      pl.dot.style.transform=`translate(${(Math.cos(a)*pl.r).toFixed(1)}px,${(Math.sin(a)*pl.r*cosP).toFixed(1)}px)`;
      pl.orbit.style.transform=`scaleY(${kY})`;
    });
  }

  let bx=0,by=0,bs=1,bo=1,sh=0,shS=1,cor=0;
  const LAND=200;

  if(p<1){ bs=9; cor=1; }
  else if(p<2){ const f=easeInOut(t); bs=lerp(9,1,f); cor=1-easeIn(clamp(t*1.25,0,1)); by=lerp(0,-520,f); }
  else if(p<3){ bx=Math.sin(now/900)*7; by=lerp(-520,-500,easeInOut(t)); }
  else if(p<6){ const q=clamp((p-3)/3,0,1); bx=Math.sin(now/900)*6; by=lerp(-500,-470,q); bo=lerp(1,.8,q); }
  else if(p<7){
    const L=proj(R_TRACK,LAND,Z_TOP,cosP,sinP), f=easeIn(t);
    bx=lerp(0,L.x,easeOut(t)); by=lerp(-470,L.y,f)-Math.sin(Math.PI*t)*10;
    sh=f*.5; shS=lerp(2.6,1,f);
  }
  else if(p<9){ const L=proj(R_TRACK,LAND-rotTop*1.6,Z_TOP,cosP,sinP); bx=L.x; by=L.y; bs=1+L.depth*.07; sh=.5; }
  else if(p<10){ const L=proj(lerp(R_TRACK,R_HOLE+34,easeInOut(t)),LAND-rotTop*1.6,Z_TOP,cosP,sinP); bx=L.x; by=L.y; bs=1+L.depth*.07; sh=.45; }
  else if(p<11){
    const k=clamp(t*1.4,0,1);
    const L=proj(lerp(R_HOLE+34,R_HOLE,easeInOut(t)), lerp(LAND-rotTop*1.6, rotTop+HOLE_A, easeInOut(k)), Z_TOP,cosP,sinP);
    bx=L.x; by=L.y;
    bs=(1+L.depth*.07)*(t>.85?lerp(1,.12,(t-.85)/.15):1);
    bo=t>.9?lerp(1,0,(t-.9)/.1):1;
    sh=.45*(1-clamp((t-.85)/.15,0,1));
    if(t>.85&&dropAngle===null) dropAngle=rotTop+HOLE_A;
  }
  else if(p<12){ const L=proj(R_HOLE,(dropAngle===null?HOLE_A:dropAngle),Z_TOP,cosP,sinP); bx=L.x; by=L.y; bo=0; sh=0; }
  else if(p<13){
    const L=proj(R_HOLE,(dropAngle===null?HOLE_A:dropAngle),Z_TOP,cosP,sinP), f=easeIn(t);
    bx=L.x; by=lerp(L.y+THICK*sinP+18, 100*sinP, f);
    bo=clamp(t*5,0,1); sh=.14+f*.18; shS=lerp(3.4,2.2,f);
  }
  else if(p<14){
    const S=proj(R_HOLE,(dropAngle===null?HOLE_A:dropAngle),Z_TOP,cosP,sinP);
    const L=proj(R_TRACK,LAND,Z_BOT,cosP,sinP), f=easeIn(t);
    bx=lerp(S.x,L.x,easeInOut(t)); by=lerp(100*sinP,L.y,f)-Math.sin(Math.PI*t)*6;
    sh=lerp(.3,.5,f); shS=lerp(2.2,1,f);
  }
  else if(p<15){ const L=proj(R_TRACK,LAND-rotBot*1.5,Z_BOT,cosP,sinP); bx=L.x; by=L.y; bs=1+L.depth*.07; sh=.5; }
  else if(p<16){ const L=proj(lerp(R_TRACK,R_TRACK-56,easeInOut(t)),LAND-rotBot*1.5,Z_BOT,cosP,sinP); bx=L.x; by=L.y; bs=1+L.depth*.07; sh=.48; }
  else {
    const k=easeOut(clamp(t*1.6,0,1));
    const L=proj(lerp(R_TRACK-56,R_POCKET,k), lerp(LAND-rotBot*1.5, rotBot+WIN_A, k), Z_BOT,cosP,sinP);
    bx=L.x; by=L.y; bs=1+L.depth*.07; sh=.45;
  }

  const focusY=lerp(camZ*sinP, by, follow), focusX=lerp(0, bx, follow);
  setT(world,'w',`translate3d(${(camX-focusX*s).toFixed(1)}px,${(camYoff-focusY*s).toFixed(1)}px,0) scale(${s.toFixed(4)})`);
  setT(ball,'b',`translate3d(${bx.toFixed(1)}px,${by.toFixed(1)}px,0) scale(${bs.toFixed(3)})`);
  setT(shadow,'sh',`translate3d(${bx.toFixed(1)}px,${(by+9).toFixed(1)}px,0) scale(${shS.toFixed(2)})`);
  if(_last.bo!==bo){_last.bo=bo; ball.style.opacity=bo;}
  if(_last.co!==cor){_last.co=cor; corona.style.opacity=cor;}
  if(_last.so!==sh){_last.so=sh; shadow.style.opacity=sh;}

  requestAnimationFrame(frame);
}

const G='#0f6a34', R='#a51c26', BR='#c9a35a', BRH='#f6e3ab', IV='#fffaf0', BK='#101010';

function logoChe(c){ /* bokstaven چ — bollen er hjulets kant, de tre prikkene er fargene */
  const m=c.mark||BRH, dots=c.mono?[m,m,m]:[G,c.light?BK:IV,R];
  return `<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
    <path d="M28 44 A82 82 0 0 0 192 44" fill="none" stroke="${m}" stroke-width="13" stroke-linecap="round"/>
    <path d="M192 44 L192 22" stroke="${m}" stroke-width="13" stroke-linecap="round"/>
    <circle cx="110" cy="86" r="9.5" fill="${dots[1]}"/>
    <circle cx="74"  cy="112" r="9.5" fill="${dots[0]}"/>
    <circle cx="146" cy="112" r="9.5" fill="${dots[2]}"/>
    <circle cx="110" cy="30" r="7" fill="${c.light?BK:IV}" opacity="${c.mono?'1':'.9'}"/>
  </svg>`;
}
function logoAxis(c){ /* de to platene og den stående akselen, sett i profil */
  const m=c.mark||BRH, acc=c.mono?m:BR;
  return `<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="110" cy="44" rx="76" ry="24" fill="none" stroke="${m}" stroke-width="9"/>
    <ellipse cx="110" cy="118" rx="76" ry="24" fill="none" stroke="${m}" stroke-width="9"/>
    <rect x="104" y="44" width="12" height="74" rx="6" fill="${acc}"/>
    <circle cx="167" cy="36" r="8" fill="${c.light?BK:IV}"/>
    ${c.mono?'':`<circle cx="110" cy="44" r="7" fill="${G}"/><circle cx="110" cy="118" r="7" fill="${R}"/>`}
  </svg>`;
}
function logoEight(c){ /* de åtte gjennomføringene som en ring */
  const m=c.mark||BRH;
  let dots='';
  for(let i=0;i<8;i++){
    const a=(i*45-90)*Math.PI/180, x=110+58*Math.cos(a), y=80+58*Math.sin(a);
    const fill = c.mono ? m : (i===0?G:(i===4?R:m));
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===2?11:8}" fill="${fill}"/>`;
  }
  return `<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
    <circle cx="110" cy="80" r="72" fill="none" stroke="${m}" stroke-width="6" opacity=".55"/>
    <circle cx="110" cy="80" r="30" fill="none" stroke="${m}" stroke-width="6"/>
    ${dots}
    <circle cx="110" cy="22" r="7.5" fill="${c.light?BK:IV}"/>
  </svg>`;
}
function logoGardoon(c){ /* 24 streker = nedre hjul, 8 lange = tallene med hull */
  const m=c.mark||BRH;
  let ticks='';
  for(let i=0;i<24;i++){
    const long=i%3===0, a=(i*15-90)*Math.PI/180;
    const r1=long?42:54, r2=72;
    const col = c.mono ? m : (long ? (i%9===0?G:(i%9===3?R:m)) : m);
    ticks+=`<line x1="${(110+r1*Math.cos(a)).toFixed(1)}" y1="${(80+r1*Math.sin(a)).toFixed(1)}" x2="${(110+r2*Math.cos(a)).toFixed(1)}" y2="${(80+r2*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${long?7:3.5}" stroke-linecap="round" opacity="${long?1:.5}"/>`;
  }
  return `<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
    ${ticks}<circle cx="110" cy="80" r="15" fill="${c.mono?m:BR}"/>
    <circle cx="110" cy="80" r="6" fill="${c.light?BK:IV}"/>
  </svg>`;
}

/* =====================================================
   5. RENDER OG NAVIGASJON
===================================================== */
let LANG='no';
const track=document.getElementById('reisen');
const langbtn=document.getElementById('langbtn');
const menu=document.getElementById('menu');

const PAGES=[{id:'reisen',t:'nav.journey'},{id:'logo',t:'nav.logo'}];
const SECTIONS=['mekanisme','mal','elektro','miljo','standarder','veikart','rettigheter'];
const SECKEY={mekanisme:'nav.mech',mal:'nav.dims',elektro:'nav.electro',miljo:'nav.env',standarder:'nav.std',veikart:'nav.road',rettigheter:'nav.ip'};

function seqRow(host, pockets, markHoles){
  host.innerHTML='';
  pockets.forEach(pk=>{
    const sp=document.createElement('span');
    sp.className=(pk[1]==='r'?'r':pk[1]==='g'?'g':'')+((markHoles&&pk[2])?' h':'');
    sp.textContent=pk[0];
    host.appendChild(sp);
  });
}

function render(){
  const L=LANG, d=T[L];
  document.documentElement.lang = L==='fa' ? 'fa' : 'no';
  document.documentElement.dir  = L==='fa' ? 'rtl' : 'ltr';
  document.body.classList.toggle('fa', L==='fa');
  langbtn.textContent = L==='fa' ? 'Norsk' : 'فارسی';

  document.querySelectorAll('[data-t]').forEach(e=>{ e.innerHTML = d[e.dataset.t] || ''; });

  track.innerHTML='';
  SCENES.forEach((sc,i)=>{
    const c=sc[L];
    const s=document.createElement('section');
    s.className='beat'; s.dataset.beat=i; s.dataset.side=sc.side;
    s.innerHTML=`<div class="copy${sc.hero?' hero':''}">
      <p class="step"><em>${sc.n}</em> ${c.k}</p>
      ${sc.hero?`<h1>${c.h}</h1>`:`<h2>${c.h}</h2>`}
      <p>${c.p}</p>
      <p class="spec">${c.s}</p>
    </div>`;
    track.appendChild(s);
  });
  beatsEls=[...track.querySelectorAll('.beat')];

  rail.innerHTML='';
  SCENES.forEach(()=>rail.appendChild(document.createElement('b')));
  railTicks=[...rail.children];

  document.getElementById('menuMain').innerHTML=
    PAGES.map(pg=>`<a href="#/${pg.id}" data-page="${pg.id}">${d[pg.t]}</a>`).join('');
  document.getElementById('menuSub').innerHTML=
    SECTIONS.map(id=>`<a href="#/reisen/${id}">${d[SECKEY[id]]}</a>`).join('');

  document.getElementById('mechCards').innerHTML=MECH.map(m=>
    `<div class="card"><span class="kk">${m.k[L]}</span><h4>${m.t[L]}</h4><p>${m.p[L]}</p></div>`).join('');

  document.getElementById('specGrid').innerHTML=SPECS.map(sp=>
    `<div><dt>${sp.l[L]}</dt><dd>${sp.v[L]}${sp.u[L]?`<small>${sp.u[L]}</small>`:''}<span class="note">${sp.n[L]}</span></dd></div>`).join('');

  const mkTable=o=>`<thead><tr>${o.head[L].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    o.rows.map(r=>`<tr>${r[L].map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
  document.getElementById('massTable').innerHTML=mkTable(MASS);
  document.getElementById('elTable').innerHTML=mkTable(EL);
  document.getElementById('stdTable').innerHTML=mkTable(STD);

  document.getElementById('envCards').innerHTML=ENV.map(e=>
    `<div class="card"><h4>${e.t[L]}</h4><p>${e.p[L]}</p></div>`).join('');

  document.getElementById('roadList').innerHTML=ROAD.map((r,i)=>
    `<li><span class="n">${String(i+1).padStart(2,'0')}</span>
      <div><h4>${r.t[L]}</h4><p>${r.p[L]}</p></div>
      <span class="status ${r.s}">${r.st[L]}</span></li>`).join('');

  document.getElementById('ipBox').innerHTML=IP[L].map(x=>`<p>${x}</p>`).join('');

  seqRow(document.getElementById('seqTop'),TOP_POCKETS,true);
  seqRow(document.getElementById('seqBot'),BOT_POCKETS,false);

  document.getElementById('logoGrid').innerHTML=LOGOS.map(lg=>`
    <div class="logocard">
      <div class="logostage">${lg.fn({})}</div>
      <div class="logovariants">
        <div class="v-brass">${lg.fn({mark:BR})}</div>
        <div class="v-light">${lg.fn({mark:BK, light:true})}</div>
        <div class="v-mono">${lg.fn({mark:'#e9e2d2', mono:true})}</div>
      </div>
      <div class="logometa">
        <span class="lat">${lg.lat}</span>
        <h4>${lg.t[L]}</h4>
        <p>${lg.p[L]}</p>
        <p class="use">${lg.u[L]}</p>
      </div>
    </div>`).join('');

  document.getElementById('swatches').innerHTML=PALETTE.map(c=>`
    <div class="swatch"><div class="chip" style="background:${c.hex}"></div>
      <div class="txt"><b>${c.t[L]}</b><span>${c.hex.toUpperCase()} · ${c.n[L]}</span></div></div>`).join('');

  markMenu();
  onScroll();
}

function markMenu(){
  document.querySelectorAll('#menuMain a').forEach(a=>
    a.classList.toggle('current', a.dataset.page===view));
}

function applyRoute(){
  const h=location.hash.replace(/^#\/?/,'');
  const [pageRaw, sec]=h.split('/');
  const page = pageRaw==='logo' ? 'logo' : 'reisen';
  const changed = page!==view;
  view=page;
  document.body.classList.toggle('view-logo', page==='logo');
  document.documentElement.classList.toggle('nosnap', page==='logo');
  markMenu();
  if(page==='reisen'){
    if(sec && document.getElementById(sec)){
      document.getElementById(sec).scrollIntoView();
    } else {
      window.scrollTo(0,0);
    }
    onScroll();
  } else if(changed){
    window.scrollTo(0,0);
  }
}
if ('scrollRestoration' in history) history.scrollRestoration='manual';
window.addEventListener('hashchange',applyRoute);
window.addEventListener('pageshow',()=>{
  const h=location.hash.replace(/^#\/?/,'');
  const [,sec]=h.split('/');
  if(!sec) requestAnimationFrame(()=>window.scrollTo(0,0));
});

const openMenu=v=>menu.classList.toggle('open',v);
document.getElementById('burger').addEventListener('click',()=>openMenu(true));
document.getElementById('menuClose').addEventListener('click',()=>openMenu(false));
menu.addEventListener('click',e=>{ if(e.target.tagName==='A'||e.target===menu) openMenu(false); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') openMenu(false); });

langbtn.addEventListener('click',()=>{
  LANG = LANG==='no' ? 'fa' : 'no';
  try{ localStorage.setItem('cg-lang',LANG); }catch(err){}
  render();
});
try{ if(localStorage.getItem('cg-lang')==='fa') LANG='fa'; }catch(err){}

render();
applyRoute();
requestAnimationFrame(frame);
</script>
