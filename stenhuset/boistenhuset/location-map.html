<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Palma og Santa Maria på Mallorca</title><link rel="stylesheet" href="assets/leaflet/leaflet.css"><style>html,body,#map{height:100%;width:100%;margin:0;background:#e5e4d9}#map{font:12px Arial,sans-serif}.leaflet-tooltip{font:11px Arial,sans-serif;background:#f8f3e9;border:0;color:#35382e;padding:7px 10px;box-shadow:0 2px 10px #35382e30}.leaflet-tooltip:before{display:none}.leaflet-control-attribution{font-size:9px}.leaflet-control-zoom{border:0!important}.leaflet-control-zoom a{background:#f8f3e9;color:#35382e}</style></head><body><div id="map" role="region" aria-label="Interaktivt kart over Palma og Santa Maria del Camí"></div><script src="assets/leaflet/leaflet.js"></script><script>
const map=L.map('map',{scrollWheelZoom:false,dragging:!L.Browser.mobile,tap:false}).setView([39.606,2.727],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}).addTo(map);
for(const [lat,lon,name,direction] of [[39.647,2.777,'Santa Maria del Camí','top'],[39.571,2.65,'Palma','left'],[39.55,2.738,'Flyplassen · PMI','bottom']]){L.circleMarker([lat,lon],{radius:6,color:'#fff8e9',weight:2,fillColor:'#9a5f3e',fillOpacity:1}).addTo(map).bindTooltip(name,{permanent:true,direction,offset:[0,0]});}
L.control.scale({imperial:false}).addTo(map);
</script></body></html>
